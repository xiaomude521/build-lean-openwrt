name: OpenWrt X86_64
on:
  workflow_dispatch:
    inputs:
      build_description:
        description: 'Release描述'
        required: false
        default: '自动构建的 OpenWrt，带有 Argon 主题和 iStoreOS 元素'
env:
  TZ: Asia/Shanghai
  UPLOAD_RELEASE: true
  KEEP_RELEASES: 3
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  build-openwrt:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - target: x86
            subtarget: 64
            profile: generic
    steps:
      - name: 拉取LEDE主源码
        uses: actions/checkout@v4
        with:
          repository: xiaomude521/lede
          ref: master
          path: lede

      - name: 拉取本仓库配置文件
        uses: actions/checkout@v4
        with:
          path: config-repo

      - name: 系统深度磁盘清理
        run: |
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/share/swift
          sudo rm -rf /usr/share/doc /usr/share/man /usr/share/locale
          df -h

      - name: 安装全套编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
          file wget llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils ccache rename \
          libelf-dev device-tree-compiler libgmp3-dev libmpc-dev libfuse-dev dos2unix

      - name: 载入自定义配置与脚本
        run: |
          dos2unix config-repo/Lean.config
          cp config-repo/Lean.config lede/.config
          cp config-repo/customize.sh lede/
          chmod +x lede/customize.sh

      - name: 校验.config编译配置
        working-directory: ./lede
        run: |
          if [ ! -f .config ]; then
            echo "错误：缺失.config编译配置"
            exit 1
          fi
          if ! grep -q "CONFIG_TARGET_x86_64" .config; then
            echo "错误：架构不是x86_64，配置异常"
            exit 1
          fi
          echo "配置校验通过"

      - name: 更新并安装feeds软件源
        working-directory: ./lede
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 执行定制化脚本customize.sh
        working-directory: ./lede
        run: ./customize.sh

      - name: 生成最终编译配置
        working-directory: ./lede
        run: make defconfig

      - name: 清理历史编译缓存
        working-directory: ./lede
        run: |
          rm -rf build_dir/target-* build_dir/toolchain-* || true
          df -h

      - name: 预下载全部源码包
        working-directory: ./lede
        run: |
          make download -j2
          find dl -size -1024c -delete
          find dl -name "*.tmp" -delete

      - name: 分段编译固件（边编译边清中间文件，防磁盘溢出）
        working-directory: ./lede
        run: |
          set -e
          echo "===== 编译tools工具链 ====="
          make -j1 tools/install V=s
          find build_dir/host -name "*.o" -delete 2>/dev/null || true
          df -h

          echo "===== 编译toolchain交叉工具链 ====="
          make -j1 toolchain/install V=s
          find build_dir/toolchain* -name "*.o" -delete 2>/dev/null || true
          df -h

          echo "===== 编译目标系统与软件包 ====="
          make -j1 target/compile V=s
          make -j1 package/compile V=s
          make -j1 target/install V=s

          echo "===== 打包固件镜像 ====="
          make -j1 image V=s
          echo "✅ 固件镜像打包完成"

      - name: 收集固件 + 强校验镜像是否存在
        id: prepare_assets
        working-directory: ./lede
        run: |
          FIRMWARE_DIR="$(pwd)/../firmware"
          mkdir -p "$FIRMWARE_DIR"

          # 锁定images目录复制所有固件格式
          find bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/images -type f \
            \( -name "*.img.gz" -o -name "*.img" -o -name "*.vmdk" -o -name "*.iso" -o -name "*.bin" -o -name "*.xz" \) \
            -exec cp -v {} "$FIRMWARE_DIR/" \;

          # 复制配置文件
          cp -v .config "$FIRMWARE_DIR/config.txt"
          cp -v bin/targets/${{ matrix.target }}/${{ matrix.subtarget }}/config.buildinfo "$FIRMWARE_DIR/buildinfo.txt"

          echo -e "\n=== 已复制到上传目录所有文件 ==="
          ls -la "$FIRMWARE_DIR/"

          # 无固件直接终止流程
          IMG_NUM=$(ls "$FIRMWARE_DIR/" | grep -E "\.(img.gz|img|iso|bin|vmdk)$" | wc -l)
          if [ "$IMG_NUM" -eq 0 ]; then
            echo "ERROR：未检索到固件镜像，终止Release发布"
            exit 1
          fi

          echo "FIRMWARE_PATH=$FIRMWARE_DIR" >> $GITHUB_ENV
          echo "prepare_assets_status=success" >> $GITHUB_ENV

      - name: 安装GitHub CLI gh上传工具
        if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.prepare_assets_status == 'success'
        run: |
          type -p curl >/dev/null || sudo apt update && sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/githubcli-archive-keyring.gpg
          sudo apt update && sudo apt install gh -y

      - name: 创建GitHub Release版本
        if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.prepare_assets_status == 'success'
        id: create_release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_id }}
          name: OpenWrt 构建 ${{ github.run_number }}
          body: ${{ inputs.build_description }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 批量上传固件到Release资产
        if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.prepare_assets_status == 'success'
        run: |
          for file in ${{ env.FIRMWARE_PATH }}/*; do
            echo "正在上传：$file"
            gh release upload build-${{ github.run_id }} "$file" --repo ${{ github.repository }}
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 自动清理旧Release
        if: env.UPLOAD_RELEASE == 'true' && !cancelled() && env.prepare_assets_status == 'success'
        run: |
          keep_count=${{ env.KEEP_RELEASES }}
          all_releases=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName,createdAt --jq '.[] | "\(.tagName) \(.createdAt)"' | sort -k2 -r)
          total_releases=$(echo "$all_releases" | wc -l)
          if [ $total_releases -gt $keep_count ]; then
            del_num=$((total_releases - keep_count))
            del_tags=$(echo "$all_releases" | tail -n $del_num | awk '{print $1}')
            for tag in $del_tags; do
              gh release delete "$tag" --repo ${{ github.repository }} --yes
            done
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
